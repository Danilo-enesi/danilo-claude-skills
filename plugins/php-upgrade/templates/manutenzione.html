<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NOME SITO — Manutenzione in corso</title>
<!-- Pagina statica (niente PHP): resta visibile anche mentre si cambia la versione di PHP. Attivazione: GUIA › PROD. -->
<style>
  :root { --brand: #1baaa2 /* colore principale del sito */; --text: #333; --muted: #6b6b6b; --bg: #f5f7f7; --card: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         padding: 24px 16px; background: var(--bg); color: var(--text);
         font: 16px/1.6 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { width: 100%; max-width: 560px; background: var(--card); border-top: 4px solid var(--brand);
         border-radius: 6px; box-shadow: 0 2px 16px rgba(0,0,0,.06); padding: 40px 32px; text-align: center; }
  img { max-width: 200px; height: auto; margin-bottom: 24px; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; color: var(--brand); }
  p { margin: 0 0 12px; }
  hr { border: 0; border-top: 1px solid #e5e5e5; margin: 28px 0; }
  .en h2 { font-size: 1.1rem; margin: 0 0 8px; color: var(--brand); }
  .en p, small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <img src="/LOGO.png" alt="NOME SITO">
  <h1>Sito in aggiornamento</h1>
  <p>Stiamo eseguendo un aggiornamento tecnico per migliorare il sito.</p>
  <p>Torneremo online a breve. Grazie per la pazienza.</p>
  <hr>
  <div class="en" lang="en">
    <h2>Website update in progress</h2>
    <p>We are carrying out a technical update. We will be back online shortly. Thank you for your patience.</p>
  </div>
</main>
</body>
</html>
