<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Manutenzione in corso</title>
<!-- Pagina statica (niente PHP, niente immagini): resta visibile anche mentre si cambia la versione di PHP.
     Da adattare solo se si vuole: NOME SITO e il colore --brand. La pubblica/toglie maintenance.sh. -->
<style>
  :root { --brand: #1baaa2; --text: #333; --muted: #6b6b6b; --bg: #f5f7f7; --card: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
         background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { width: 100%; max-width: 520px; background: var(--card); border-top: 4px solid var(--brand); border-radius: 6px;
         box-shadow: 0 2px 16px rgba(0,0,0,.06); padding: 36px 28px; text-align: center; }
  .site { font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 16px; }
  h1 { font-size: 1.35rem; margin: 0 0 12px; color: var(--brand); }
  p { margin: 0 0 10px; }
  hr { border: 0; border-top: 1px solid #e5e5e5; margin: 24px 0; }
  .en h2 { font-size: 1.05rem; margin: 0 0 8px; color: var(--brand); }
  .en p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="site">NOME SITO</p>
  <h1>Sito in aggiornamento</h1>
  <p>Stiamo eseguendo un aggiornamento tecnico. Torneremo online a breve.</p>
  <p>Grazie per la pazienza.</p>
  <hr>
  <div class="en" lang="en">
    <h2>Website update in progress</h2>
    <p>We are carrying out a technical update and will be back online shortly. Thank you for your patience.</p>
  </div>
</main>
</body>
</html>
